[project]
name = "ibkr_chroma"
version = "0.1.0"
description = "Quantitative Factor, PCA, and Dispersion Trading with IBKR and ChromaDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ib_async>=2.0.1",
    "chromadb>=0.4.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "lxml>=6.1.3",
    "pyarrow>=25.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
